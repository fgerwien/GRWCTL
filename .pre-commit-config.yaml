repos:
  - repo: https://github.com/ambv/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.11
        files: \.py$  # Ensure this matches your Python files
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        files: \.py$  # Ensure this matches your Python files
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: \.py$  # Ensure this matches your Python files